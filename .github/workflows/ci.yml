name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Test and enforce coverage
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          if-no-files-found: warn
          path: |
            target/surefire-reports/
            target/site/jacoco/

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    env:
      AGENT_OPERATOR_PASSWORD: ci-operator-password
      AGENT_APPROVER_PASSWORD: ci-approver-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --tag agentic-engineering-system:${{ github.sha }} .
