spring:
  application:
    name: agentic-engineering-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agentic_engineering}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

agentic:
  workspace:
    root: ${AGENT_WORKSPACE_ROOT:./agent-workspaces}
  execution:
    max-attempts: ${AGENT_MAX_ATTEMPTS:2}
    command-timeout: ${AGENT_COMMAND_TIMEOUT:PT120S}
  model:
    provider: ${MODEL_PROVIDER:deterministic}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-}] %logger{36} - %msg%n"