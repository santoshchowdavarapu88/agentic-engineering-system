spring:
  application:
    name: agentic-engineering-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agentic_engineering}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

agentic:
  workspace:
    root: ${AGENT_WORKSPACE_ROOT:./agent-workspaces}
    max-files: ${AGENT_WORKSPACE_MAX_FILES:5000}
    max-bytes: ${AGENT_WORKSPACE_MAX_BYTES:52428800}
  repository:
    allowed-root: ${AGENT_REPOSITORY_ROOT:./scenario-repositories}
    max-read-characters: ${AGENT_MAX_READ_CHARACTERS:200000}
    max-search-results: ${AGENT_MAX_SEARCH_RESULTS:100}
    max-context-characters: ${AGENT_MAX_CONTEXT_CHARACTERS:120000}
  patch:
    max-files: ${AGENT_PATCH_MAX_FILES:100}
    max-bytes: ${AGENT_PATCH_MAX_BYTES:1048576}
  execution:
    max-attempts: ${AGENT_MAX_ATTEMPTS:2}
    command-timeout: ${AGENT_COMMAND_TIMEOUT:PT120S}
  model:
    provider: ${MODEL_PROVIDER:deterministic}
    base-url: ${MODEL_BASE_URL:https://api.openai.com}
    api-key: ${MODEL_API_KEY:}
    name: ${MODEL_NAME:gpt-4.1-mini}
    timeout: ${MODEL_TIMEOUT:PT60S}
    max-output-characters: ${MODEL_MAX_OUTPUT_CHARACTERS:100000}
    max-output-tokens: ${MODEL_MAX_OUTPUT_TOKENS:8000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-}] %logger{36} - %msg%n"
