spring:
  datasource:
    url: jdbc:h2:mem:agentic-engineering;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: false

agentic:
  workspace:
    root: ${java.io.tmpdir}/agentic-engineering-tests
    max-files: 1000
    max-bytes: 10485760
  repository:
    allowed-root: ${java.io.tmpdir}/agentic-scenario-tests
    max-read-characters: 50000
    max-search-results: 50
    max-context-characters: 30000
  model:
    provider: deterministic
    base-url: http://localhost
    api-key: ""
    name: test-model
    timeout: PT5S
    max-output-characters: 10000
    max-output-tokens: 1000
